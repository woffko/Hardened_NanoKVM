[package]
name = "nanokvm-rust-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = []
linked-libkvm = []
sandbox-test-fixture = []

[[bin]]
name = "nanokvm-sandbox-fixture"
path = "tests/fixtures/sandbox_probe.rs"
required-features = ["sandbox-test-fixture"]
test = false

[[bin]]
name = "nanokvm-raw-transfer-fixture"
path = "tests/fixtures/raw_transfer_probe.rs"
required-features = ["sandbox-test-fixture"]
test = false

[dependencies]
aes = "0.8"
argon2 = { version = "0.5", features = ["std"] }
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
base64 = "0.22"
bcrypt = "0.16.0"
bytes = "1"
cbc = "0.1"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "stream"] }
cipher = "0.4"
flate2 = "1"
futures-util = { version = "0.3.32", features = ["sink"] }
md-5 = "0.10"
linux-raw-sys = { version = "=0.12.1", default-features = false, features = ["std", "general", "ioctl", "loop_device"] }
nix = { version = "0.29.0", features = ["fs", "ioctl", "mount", "net", "process", "resource", "sched", "signal", "term", "user"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.13"
rtcp = "0.17.1"
rustix = { version = "=1.1.4", features = ["fs", "net", "process", "thread"] }
seccompiler = { version = "=0.5.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
time = { version = "0.3.51", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
webrtc = "0.17.1"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
