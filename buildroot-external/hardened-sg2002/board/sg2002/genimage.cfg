image boot.vfat {
	vfat {
		label = "boot"
		extraargs = "--invariant"
		files = {
			"fip.bin",
			"rawimages/boot.sd",
			"usb.dev",
			"usb.disk0",
			"wifi.sta",
			"gt9xx",
			"logo.jpeg",
			"ver",
		}
	}
	size = 16M
}

image hardened-sg2002-port.img {
	hdimage {
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.sd"
	}
}
