# Root writes and reads files in /tmp, where every account can write. Refuse to
# follow another account's link there, to hard-link a file one cannot write, and
# to open another account's file or FIFO there for writing. S01fs sets the same.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 2
